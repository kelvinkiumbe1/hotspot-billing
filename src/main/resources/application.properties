spring.application.name=hotspot-billing
# Local-only secrets (M-Pesa sandbox keys etc.) live in local.properties at the
# repo root — gitignored, optional, and its values override the defaults below.
spring.config.import=optional:file:./local.properties
# PORT is what Render (and most PaaS) inject and route to; SERVER_PORT is what
# the Docker image and compose set. Prefer PORT so a Render deploy binds the
# right port with no extra config, and fall back to SERVER_PORT elsewhere.
server.port=${PORT:${SERVER_PORT:8081}}

# --- Database: PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotspot_billing}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Flyway owns the schema now. Hibernate only checks that the tables match
# the entities and refuses to start if they do not — it no longer edits
# anything, so no change reaches a customer database unreviewed.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# An existing database predates the migrations, so the baseline is recorded
# as already applied rather than being run against populated tables.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Admin login (HTTP Basic on /api/admin/**) ---
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# --- Platform billing link (how this ISP pays Zidi). Set by the provisioner;
# --- blank means the "Pay" button reports billing isn't wired yet. The token
# --- and control-plane URL let this tenant raise/settle its own invoice via
# --- the control plane, which owns Zidi's M-Pesa. ---
platform.control-url=${ZIDI_CONTROL_URL:}
platform.token=${ZIDI_PLATFORM_TOKEN:}
tenant.slug=${ZIDI_TENANT_SLUG:}

# --- WhatsApp self-service bot: the token you set in Meta's webhook config so
# --- it can verify the callback URL. Inbound messages use the same WhatsApp
# --- number/credentials as outbound (Settings -> SMS & WhatsApp). ---
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

# --- Read-only demo. Only a dedicated demo/marketing deployment turns this
# --- on: it seeds a "demo" owner login + realistic sample data and enables
# --- the /api/auth/demo entry. Real ISP deployments leave it off so no
# --- sample data or read-only login ever appears in their database.
demo.enabled=${DEMO_ENABLED:false}

# --- First technician account, seeded once (manage more from the admin Team page) ---
tech.username=${TECH_USERNAME:technician}
tech.password=${TECH_PASSWORD:tech123}

# --- SMS (Africa's Talking; disabled until credentials are set) ---
sms.enabled=${SMS_ENABLED:false}
sms.username=${SMS_USERNAME:}
sms.api-key=${SMS_API_KEY:}
sms.sender-id=${SMS_SENDER_ID:}
sms.base-url=${SMS_BASE_URL:https://api.africastalking.com}

# --- WhatsApp Cloud API (tried before SMS when enabled) ---
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com/v21.0}

# --- Uploads (task photos) ---
app.upload-dir=${UPLOAD_DIR:uploads}

# --- Public URL of the customer portal (used in SMS pay links) ---
app.portal-url=${PORTAL_URL:http://localhost:5173}

# --- Hotspot re-purchase nudge (WhatsApp/SMS before a pass runs out) ---
hotspot.nudge.enabled=${HOTSPOT_NUDGE_ENABLED:true}
hotspot.nudge.lead-minutes=${HOTSPOT_NUDGE_LEAD_MINUTES:10}

# --- Hotspot data-bundle top-up nudge (when a capped pass nears its data cap) ---
hotspot.data-nudge.enabled=${HOTSPOT_DATA_NUDGE_ENABLED:true}
hotspot.data-nudge.threshold-percent=${HOTSPOT_DATA_NUDGE_THRESHOLD:80}

# --- Voucher-sharing alert (one code active on several devices at once) ---
hotspot.sharing.alert-enabled=${HOTSPOT_SHARING_ALERT:true}

# --- KRA eTIMS fiscalisation (off until KRA credentials + device registration) ---
etims.enabled=${ETIMS_ENABLED:false}
# DRYRUN signs invoices locally (sandbox); KRA is the real submission (not yet wired).
etims.provider=${ETIMS_PROVIDER:DRYRUN}
etims.control-unit=${ETIMS_CONTROL_UNIT:KRACU0100000000}

# --- Dunning: recover failed auto-renewals with escalating retries ---
dunning.enabled=${DUNNING_ENABLED:true}
# Hours between successive retries after the initial auto-renewal prompt.
dunning.retry-hours=${DUNNING_RETRY_HOURS:4,12,24,48}

# --- Win-back: re-engage customers who stayed lapsed after dunning ---
winback.enabled=${WINBACK_ENABLED:true}
# Days after a lapse to send each come-back message (first should clear dunning).
winback.days=${WINBACK_DAYS:3,10,21}

# --- Phone that receives router-offline alerts (blank = no alerts) ---
app.alert-phone=${ALERT_PHONE:}

# --- PayBill number customers pay to (shown in the admin and SMS) ---
mpesa.paybill=${MPESA_PAYBILL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Response compression ---
# JSON from this app compresses about eleven to one -- the subscriber list
# measured 20,663 bytes plain and 1,889 gzipped, and at five thousand customers
# that is 4.1 MB becoming roughly 384 KB. It was off only because Spring Boot
# defaults it off. The 1 KB floor is there because compressing a tiny response
# costs more CPU than it saves bytes.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=1024

# --- Database connections ---
# Ten is the Hikari default and it was never chosen. Twenty gives the request
# threads room without crowding PostgreSQL, which allows 100 connections by
# default and has to leave some for the scheduled jobs, psql and pg_dump.
# Raising this past what Postgres allows turns a slow page into a failed one.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
# Fail fast rather than hang a request thread for thirty seconds behind an
# exhausted pool: an error an operator can see beats a page that never loads.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000

# --- Safaricom Daraja (M-Pesa) ---
# Sandbox by default. A live deployment MUST set this to
# https://api.safaricom.co.ke or it will take no real money.
mpesa.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
mpesa.short-code=${MPESA_SHORT_CODE:174379}
mpesa.passkey=${MPESA_PASSKEY:}
# Must be a public HTTPS URL Safaricom can reach (use ngrok during development)
mpesa.callback-url=${MPESA_CALLBACK_URL:https://example.com/api/payments/mpesa/callback}

# --- MikroTik RouterOS API ---
# These are only the seed values for the first Router row; routers are
# managed from the admin Routers page once the app is running.
mikrotik.enabled=${MIKROTIK_ENABLED:false}
# Blank by default so a new account starts empty — the ISP enters their own
# router address and login. A real deployment can still seed these via env.
mikrotik.host=${MIKROTIK_HOST:}
mikrotik.port=${MIKROTIK_PORT:8728}
mikrotik.username=${MIKROTIK_USERNAME:}
mikrotik.password=${MIKROTIK_PASSWORD:}

# --- Passkeys (WebAuthn) ---
# rp-id must be a registrable suffix of the origin host. "localhost" for dev;
# in production set it to the tenant's domain (e.g. spawifi.co.ke). Origins is
# the comma-separated list of exact page origins allowed to enrol/sign in —
# the Vite dev ports here, your https://domain in production.
webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
webauthn.rp-name=${WEBAUTHN_RP_NAME:SPA WiFi}
webauthn.origins=${WEBAUTHN_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8081}
# When true, a staff member with no passkey is forced to enrol one right after
# signing in with their password. Left off until the platform is on real HTTPS
# (WebAuthn needs a secure context), so turning it on before the domain is live
# cannot lock anyone out.
webauthn.enrollment-required=${WEBAUTHN_ENROLLMENT_REQUIRED:false}

# --- M-Pesa callback source allowlist ---
# Only these IPs/CIDRs may post to the public callback endpoints. Empty means
# accept from anywhere (fine for the Daraja sandbox; NEVER in production). The
# defaults are Safaricom's published callback ranges — override with the exact
# set Safaricom gives you at go-live. In the sandbox set MPESA_CALLBACK_ALLOWED_IPS=
# (empty) to disable the check while testing through ngrok.
mpesa.callback-allowed-ips=${MPESA_CALLBACK_ALLOWED_IPS:196.201.212.0/24,196.201.213.0/24,196.201.214.0/24}

# --- Browser CORS ---
# Which page origins may call the API from a browser. Dev default is any
# localhost port (Vite hops around). In production the SPA is served
# same-origin so CORS is not exercised, but set this to your exact https
# origin(s) anyway so a page on another site can't drive a signed-in user's
# session. Comma-separated; * wildcard allowed in the host.
app.cors-allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
