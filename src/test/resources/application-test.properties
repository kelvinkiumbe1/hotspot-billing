# Test overrides. This is a *profile* overlay, not a replacement: the main
# application.properties still loads, so every default the application expects
# is present and a new setting added there never breaks the suite. Only what
# tests must do differently belongs here.

# In-memory H2 so no PostgreSQL is needed to run the suite.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# The migrations are PostgreSQL-specific from V1 onwards (identity columns,
# TIMESTAMPTZ, BIGSERIAL), which H2 rejects even in PostgreSQL mode — which is
# why this suite has never been able to start. Hibernate builds the schema from
# the entities instead, which is what a wiring test needs. The migrations are
# exercised for real every time the app boots against PostgreSQL.
spring.flyway.enabled=false

# Nothing scheduled should fire while a test is running.
spring.task.scheduling.pool.size=1

admin.username=admin
admin.password=admin123
tech.username=technician
tech.password=tech123

mikrotik.enabled=false
sms.enabled=false
whatsapp.enabled=false
demo.enabled=false
