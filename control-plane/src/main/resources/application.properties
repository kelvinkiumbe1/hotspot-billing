spring.application.name=zidi-control-plane

# The control plane runs beside the tenant stacks on the host, on its own port.
server.port=${CONTROL_PORT:8090}

# Its own small registry database (who signed up, provisioning status) — entirely
# separate from any tenant's billing database.
spring.datasource.url=${CONTROL_DB_URL:jdbc:postgresql://localhost:5432/zidi_control}
spring.datasource.username=${CONTROL_DB_USERNAME:postgres}
spring.datasource.password=${CONTROL_DB_PASSWORD:postgres}
# A tiny single-table registry; let Hibernate manage it rather than carry Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The base domain new tenants get a subdomain under, e.g. acme.zidi.co.ke.
zidi.base-domain=${ZIDI_BASE_DOMAIN:zidi.co.ke}

# Where deploy/new-tenant.sh lives, so the provisioner can invoke it.
zidi.repo-dir=${ZIDI_REPO_DIR:..}

# Provisioning mode:
#   DRY_RUN  logs what it would do (default; safe, no Docker)
#   LOCAL    stands up a real app instance per tenant as an OS process (no
#            Docker) — for creating genuinely loginable accounts on a dev box
#   SCRIPT   runs deploy/new-tenant.sh on a real Docker host (production)
zidi.provisioner=${ZIDI_PROVISIONER:DRY_RUN}

# --- LOCAL provisioner settings (only used when zidi.provisioner=LOCAL) ---
# The billing app jar (must include the built frontend — deploy/build-local-app.sh
# produces it). Each tenant is launched from this same jar against its own DB.
zidi.local.app-jar=${ZIDI_LOCAL_APP_JAR:../target/hotspot-billing-0.0.1-SNAPSHOT.jar}
# Java to launch tenants with (the system default is often too old — point at
# the same JDK you run the apps with).
zidi.local.java-bin=${ZIDI_LOCAL_JAVA_BIN:java}
# Tenant ports are base-port + tenant id, e.g. 8101, 8102, …
zidi.local.base-port=${ZIDI_LOCAL_BASE_PORT:8100}
# Postgres the tenant databases are created in and connected to.
zidi.local.db-admin-url=${ZIDI_LOCAL_DB_ADMIN_URL:jdbc:postgresql://localhost:5432/postgres}
zidi.local.db-host-url=${ZIDI_LOCAL_DB_HOST_URL:jdbc:postgresql://localhost:5432/}
zidi.local.db-username=${ZIDI_LOCAL_DB_USERNAME:postgres}
zidi.local.db-password=${ZIDI_LOCAL_DB_PASSWORD:postgres}
# Where per-tenant logs are written.
zidi.local.runtime-dir=${ZIDI_LOCAL_RUNTIME_DIR:./local-tenants}

# Shared secret for the small platform-admin API (X-Admin-Token header). Blank
# by default, which refuses all admin calls until one is set.
zidi.admin-token=${ZIDI_ADMIN_TOKEN:}

# --- Platform billing: how ISPs pay Zidi ---
# Shared token tenants present (X-Zidi-Token) to raise/settle their own invoice.
# Blank refuses all platform-billing calls; the local provisioner generates a
# dev token and passes it to tenants automatically.
zidi.platform.token=${ZIDI_PLATFORM_TOKEN:}
# STK provider: DRY_RUN logs and awaits manual confirmation (local); DARAJA
# collects for real against Zidi's own M-Pesa.
zidi.platform.provider=${ZIDI_PLATFORM_PROVIDER:DRY_RUN}
# Zidi's OWN Daraja app (only used when provider=DARAJA). These never leave the
# control plane.
zidi.platform.mpesa.base-url=${ZIDI_MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
zidi.platform.mpesa.consumer-key=${ZIDI_MPESA_CONSUMER_KEY:}
zidi.platform.mpesa.consumer-secret=${ZIDI_MPESA_CONSUMER_SECRET:}
zidi.platform.mpesa.short-code=${ZIDI_MPESA_SHORT_CODE:}
zidi.platform.mpesa.passkey=${ZIDI_MPESA_PASSKEY:}
zidi.platform.mpesa.callback-url=${ZIDI_MPESA_CALLBACK_URL:}

# Require a signup to confirm its email address before anything is built.
#
# Off by default, which keeps the existing behaviour. Turn it on in production:
# a public form invites junk, and a container plus a database per junk signup is
# the expensive kind. When it is on, a signup whose confirmation email cannot be
# sent is refused and deleted rather than left as a permanent squatter on the
# slug -- so this needs working SMTP below.
zidi.signup.require-email-verification=${SIGNUP_REQUIRE_EMAIL:false}

# The address the outside world reaches this control plane on, used to build the
# confirmation link. Behind a proxy the process cannot work this out itself, and
# a link pointing at localhost is a link nobody can click.
zidi.public-url=${ZIDI_PUBLIC_URL:}

# Email the owner when their account is ready. Off unless SMTP is configured;
# provisioning never fails just because mail isn't set up.
zidi.mail.enabled=${MAIL_ENABLED:false}
zidi.mail.from=${MAIL_FROM:Zidi <no-reply@zidi.co.ke>}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
